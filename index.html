    body { font-family: 'Quicksand', sans-serif; background: #000; color: #e0e0f0; }
    .app-wrap { height: 100%; width: 100%; position: relative; overflow: hidden; }
    
    .star {
      position: absolute;
      width: 3px; height: 3px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.6s ease, box-shadow 0.6s ease, opacity 0.6s ease;
      opacity: 0;
    }
    .star:hover {
      transform: scale(4);
      box-shadow: 0 0 20px 8px rgba(200, 180, 255, 0.5);
    }
    .star.visible { opacity: 1; }
    .star.special { background: #c8b4ff; width: 5px; height: 5px; box-shadow: 0 0 8px 2px rgba(200,180,255,0.4); }
    
    .phrase-bubble {
      position: absolute;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: rgba(220, 210, 255, 0.9);
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50px);
      text-shadow: 0 0 10px rgba(180,160,255,0.4);
    }

    .corner-timer {
      position: absolute;
      top: 20px; right: 24px;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
      font-family: 'Quicksand', sans-serif;
      transition: all 2.5s cubic-bezier(0.25, 0.1, 0.25, 1);
      color: rgba(200, 190, 255, 0.8);
    }
    .corner-timer.centered {
      top: 50%; right: 50%;
      transform: translate(50%, -50%);
      font-size: 14px;
      opacity: 1;
    }

    .timer-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
      font-family: 'Cormorant Garamond', serif;
    }
    .timer-center.visible { opacity: 1; }
    .timer-center .seconds { font-size: 42px; letter-spacing: 6px; color: #fff; text-shadow: 0 0 30px rgba(180,160,255,0.5); }
    .timer-center .sub { font-size: 16px; letter-spacing: 3px; color: rgba(200,190,255,0.7); margin-top: 6px; }

    .intro-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 1px;
      line-height: 1.8;
      color: rgba(220, 210, 255, 0.9);
      text-shadow: 0 0 20px rgba(150,130,200,0.3);
    }

    .final-text {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: rgba(200, 190, 255, 0.8);
      opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 0 0 15px rgba(150,130,200,0.3);
    }
    .final-text.visible { opacity: 1; }

    canvas#nebula {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 4s ease;
    }
    canvas#nebula.visible { opacity: 1; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>

 <body>

    <div class="seconds" id="tc-seconds"></div>

  <script>
const defaultConfig = {
  intro_line_1: "El tiempo nunca deja de avanzar",
  intro_line_2: "Algo extraño sobre la vida…",
  intro_line_3: "es cómo algunas personas se vuelven parte de ti.",
  intro_line_4: "Y de alguna manera…",
  intro_line_5: "TE VOLVISTE PARTE DE MI.",
  final_line_1: "Y aún el tiempo avanza…",
  final_line_2: "como cada cosa que siento por ti.",
  background_color: "#000011",
  surface_color: "#1a1a2e",
  text_color: "#e0e0f0",
  primary_color: "#c8b4ff",
  secondary_color: "#6b5b95",
  font_family: "Cormorant Garamond",
  font_size: 16
};

// State
let baseTime = Date.now() - (30 * 24 * 60 * 60 * 1000); // 30 days ago
let totalSeconds = Math.floor((Date.now() - baseTime) / 1000);
let phase = 'intro'; // intro, transition, main, final
let audioCtx = null;
let introLines = [];
let stars = [];

const starPhrases = [
  "Que cosa tan extraña fue besarte... Pero eres lo mejor que mis labios han probado",
  "No sé cuándo te volviste muy importante para mi.",
  "Has estado tanto en mis días que ya no sé cómo eran sin ti.",
  "No lo esperaba, pero me alegra que sea contigo.",
  "Nunca tuve que acostumbrarme a ti, ya me sentía natural.",
  "Algunos momentos contigo se quedaron en mí más del tiempo que deberían.",
  "Todavía me alegra recibir un mensaje tuyo.",
  "Me acostumbré a ti antes de entender por qué.",
  "Siempre estuvimos ahí, solo que ahora se siente distinto.",
  "Algunos silencios contigo lo decían todo.",
  "No sé cuándo empezó, solo sé que no se detuvo",
  "No sé a dónda va esto, pero quiero verlo contigo",
  "Te elegía incluso antes de saber por qué",
  "Solo espero que no perdamos lo que tenemos, mientras descubrimos lo que podemos ser.",
  "Me importas más de lo que digo",
  "No fue intención, pero pasó contigo",
  "Algo tuyo siempre se quedó",
  "No era el plan, pero tampoco lo evitaría",
  "Entre todo lo normal apareciste diferente",
  "No te busqué pero no te dejaré ir",
  "Nunca fuiste casualidad",
  "Contigo, el tiempo se detiene a mirarnos."
];
const specialPhrase = ["La mejor parte de todo el tiempo…", "fuiste tú."];

const startDate = new Date(2026, 3, 6, 14, 43, 0)

// Nebula canvas
const nebCanvas = document.getElementById('nebula');
const nebCtx = nebCanvas.getContext('2d');
function resizeNebula() {
  nebCanvas.width = window.innerWidth;
  nebCanvas.height = window.innerHeight;
}
resizeNebula();
window.addEventListener('resize', resizeNebula);

function drawNebula() {
  const w = nebCanvas.width, h = nebCanvas.height;
  nebCtx.clearRect(0, 0, w, h);
  // Gradient background
  const g = nebCtx.createRadialGradient(w*0.4, h*0.5, 0, w*0.5, h*0.5, w*0.7);
  g.addColorStop(0, 'rgba(30, 20, 60, 0.3)');
  g.addColorStop(0.5, 'rgba(15, 10, 40, 0.2)');
  g.addColorStop(1, 'rgba(0, 0, 10, 0)');
  nebCtx.fillStyle = g;
  nebCtx.fillRect(0, 0, w, h);
  // Second nebula
  const g2 = nebCtx.createRadialGradient(w*0.7, h*0.3, 0, w*0.6, h*0.4, w*0.5);
  g2.addColorStop(0, 'rgba(60, 30, 80, 0.15)');
  g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
  nebCtx.fillStyle = g2;
  nebCtx.fillRect(0, 0, w, h);
}
drawNebula();

// Stars
function createStars() {
  const container = document.getElementById('stars-container');
  container.innerHTML = '';
  stars = [];
  const count = 22;

  const positions = [];

  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star' + (i === count - 1 ? ' special' : '');

    let safe = false;
    let safeX, safeY;

    while (!safe) {
      const centerX = 50;
      const centerY = 50;

      const minRadius = 18;
      const maxRadius = 40;

      const angle = Math.random() * 2 * Math.PI;
      const radius = minRadius + Math.random() * (maxRadius - minRadius);

      const x = centerX + radius * Math.cos(angle);
      const y = centerY + radius * Math.sin(angle);

      safeX = Math.min(95, Math.max(5, x));
      safeY = Math.min(90, Math.max(10, y));

      safe = true;
      for (let pos of positions) {
        const dx = pos.x - safeX;
        const dy = pos.y - safeY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 10) {
          safe = false;
          break;
        }
      }

      if (safe) {
        positions.push({ x: safeX, y: safeY });
      }
    }

    star.style.left = safeX + '%';
    star.style.top = safeY + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';

    // BURBUJA 
    const bubble = document.createElement('div');
    bubble.className = 'phrase-bubble';
    bubble.style.left = star.style.left;
    bubble.style.top = (parseFloat(star.style.top) - 4) + '%';

    const isSpecial = i === count - 1;
    const phrase = isSpecial ? specialPhrase : [starPhrases[i % starPhrases.length]];

    let typing = null;
    let deleting = null;
    let frozen = false;

    star.addEventListener('mouseenter', () => {
      if (frozen) return;
      clearTimeout(deleting);
      bubble.textContent = '';

      let fullText = phrase.join('\n');
      let idx = 0;

      const type = () => {
        if (idx <= fullText.length) {
          bubble.textContent = fullText.slice(0, idx);
          adjustBubblePosition(bubble);
          idx++;
          typing = setTimeout(type, 35);
        } else if (isSpecial) {
          frozen = true;
        }
      };

      type();
    });

    star.addEventListener('mouseleave', () => {
      if (frozen) return;
      clearTimeout(typing);

      const del = () => {
        if (bubble.textContent.length > 0) {
          bubble.textContent = bubble.textContent.slice(0, -1);
          deleting = setTimeout(del, 20);
        }
      };

      del();
    });

    container.appendChild(star);
    container.appendChild(bubble);
    stars.push(star);
  }
}

createStars();

// Timer
function updateTimer() {
  const { seconds, minutes, hours, days, months } = getTimeData();

  document.getElementById('corner-timer').textContent = seconds.toLocaleString() + ' seconds';
  document.getElementById('tc-seconds').textContent = seconds.toLocaleString() + ' seconds';
  document.getElementById('tc-minutes').textContent = minutes.toLocaleString() + ' minutes';
  document.getElementById('tc-hours').textContent = hours.toLocaleString() + ' hours';
  document.getElementById('tc-days').textContent = days + ' days';
  document.getElementById('tc-months').textContent = months + (months === 1 ? ' month' : ' months');
}
setInterval(updateTimer, 1000);
updateTimer();

// Intro sequence
async function runIntro() {
  const cfg = window.elementSdk?.config || defaultConfig;
  introLines = [
    cfg.intro_line_1 || defaultConfig.intro_line_1,
    cfg.intro_line_2 || defaultConfig.intro_line_2,
    cfg.intro_line_3 || defaultConfig.intro_line_3,
    cfg.intro_line_4 || defaultConfig.intro_line_4,
    cfg.intro_line_5 || defaultConfig.intro_line_5
  ];

  const el = document.getElementById('intro-text');
  for (let line of introLines) {
    el.style.opacity = '0';
    el.textContent = line;
    await sleep(200);
    el.style.transition = 'opacity 2s ease';
    el.style.opacity = '1';
    await sleep(3500);
    el.style.opacity = '0';
    await sleep(1500);
  }
  el.style.display = 'none';
  startTransition();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function getTimeData() {
    const now = new Date();
    
    const diff = now - startDate;
    
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(diff / (1000 * 60));
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    let months =
    (now.getFullYear() - startDate.getFullYear()) * 12 +
    (now.getMonth() - startDate.getMonth());
    
    // crear fecha "+ 1" este mes
    const anniversary = new Date(
    now.getFullYear(),
    now.getMonth(),
    startDate.getDate(),
    startDate.getHours(),
    startDate.getMinutes(),
    startDate.getSeconds()
);

// si aún no se alcanza ese momento exacto → restar 1
if (now < anniversary) {
  months--;
}


  return { seconds, minutes, hours, days, months };
}

async function startTransition() {
  phase = 'transition';
  // Show nebula and stars
  nebCanvas.classList.add('visible');
  stars.forEach((s, i) => setTimeout(() => s.classList.add('visible'), i * 200));
  
  // Move corner timer to center then hide it, show center timer
  const ct = document.getElementById('corner-timer');
  ct.style.opacity = '0';
  await sleep(1500);
  ct.style.display = 'none';
  
  const tc = document.getElementById('timer-center');
  tc.classList.add('visible');
  phase = 'main';

  // After some time, show final
  await sleep(25000);
  showFinal();
}

async function showFinal() {
  phase = 'final';
  const cfg = window.elementSdk?.config || defaultConfig;
  const ft = document.getElementById('final-text');
  ft.textContent = cfg.final_line_1 || defaultConfig.final_line_1;
  ft.classList.add('visible');
  await sleep(3000);
  ft.textContent = (cfg.final_line_1 || defaultConfig.final_line_1) + '\n' + (cfg.final_line_2 || defaultConfig.final_line_2);
  ft.style.whiteSpace = 'pre-line';
}

// Start on click
let started = false;
document.getElementById('app').addEventListener('click', () => {
  if (!started) {
    started = true;

    const audio = document.getElementById('bg-music');
    audio.volume = 0.25;
    audio.play();

    runIntro();
  }
}, { once: false });

// Show click prompt
const prompt = document.createElement('div');
prompt.style.cssText = 'position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:3px;opacity:0.4;color:#a09cc0;font-family:Quicksand,sans-serif;';
prompt.textContent = 'Toca para iniciar';
document.getElementById('app').appendChild(prompt);

function adjustBubblePosition(bubble) {
  const rect = bubble.getBoundingClientRect();

  // si se sale por la derecha
  if (rect.right > window.innerWidth) {
    bubble.style.transform = 'translateX(-100%)';
  }

  // si se sale por la izquierda
  else if (rect.left < 0) {
    bubble.style.transform = 'translateX(0)';
  }

  // si está bien centrado
  else {
    bubble.style.transform = 'translateX(-50%)';
  }

  // si se sale por abajo
  if (rect.bottom > window.innerHeight) {
    bubble.style.top = (parseFloat(bubble.style.top) - 5) + '%';
  }

  // si se sale por arriba
  if (rect.top < 0) {
    bubble.style.top = (parseFloat(bubble.style.top) + 5) + '%';
  }
}

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    document.body.style.background = config.background_color || defaultConfig.background_color;
    const ff = config.font_family || defaultConfig.font_family;
    document.querySelectorAll('.intro-text, .timer-center, .final-text, .phrase-bubble').forEach(el => {
      el.style.fontFamily = `${ff}, serif`;
    });
    const tc = config.text_color || defaultConfig.text_color;
    document.body.style.color = tc;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["intro_line_1", config.intro_line_1 || defaultConfig.intro_line_1],
    ["intro_line_2", config.intro_line_2 || defaultConfig.intro_line_2],
    ["intro_line_3", config.intro_line_3 || defaultConfig.intro_line_3],
    ["intro_line_4", config.intro_line_4 || defaultConfig.intro_line_4],
    ["intro_line_5", config.intro_line_5 || defaultConfig.intro_line_5],
    ["final_line_1", config.final_line_1 || defaultConfig.final_line_1],
    ["final_line_2", config.final_line_2 || defaultConfig.final_line_2]
  ])
});
